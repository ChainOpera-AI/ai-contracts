# Solidity dependencies come from npm (see package.json), not from foundry's lib/.
# Run `npm install` once before `forge test`.
[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = []
optimizer = true
optimizer_runs = 200
# Required: without the IR pipeline Subscription compiles to ~27.9KB and cannot be deployed.
# The initializer's code counts against the 24KB runtime limit, unlike a constructor's.
via_ir = true
solc_version = "0.8.28"
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@chainlink/=node_modules/@chainlink/",
]
